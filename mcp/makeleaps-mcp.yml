api: MakeLeaps API
summary: MakeLeaps does not operate an official hosted/remote MCP server. Instead the developer portal
  publishes a tutorial for building your own local MCP server (Python, fastmcp, run via uv) that wraps
  the MakeLeaps REST API over your invoice data. The tools below are the four functions documented in
  that tutorial; they are a DERIVED candidate surface, not an official MakeLeaps-hosted server.
transport: stdio
framework: fastmcp (Python)
auth: OAuth 2.0 client-credentials (MAKELEAPS_CLIENT_ID / MAKELEAPS_CLIENT_SECRET / MAKELEAPS_PARTNER_MID)
base_url: https://api.makeleaps.com/api/partner/{partner_mid}
tools:
- name: list_clients
  description: List all clients (partners) for the authenticated MakeLeaps partner.
  maps_to: GET /api/partner/{partner_mid}/client/
- name: list_invoices
  description: List documents/invoices, filterable by status and date.
  maps_to: GET /api/partner/{partner_mid}/document/
- name: get_invoice
  description: Retrieve the details of a single invoice/document by id.
  maps_to: GET /api/partner/{partner_mid}/document/{invoice_id}/
- name: create_invoice
  description: Create a new invoice/document.
  maps_to: POST /api/partner/{partner_mid}/document/
